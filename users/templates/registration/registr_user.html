{% extends "home.html" %}
{% block title %}{{ product.name }}{% endblock %}
{% block content %}
<div class="container-fluid d-flex h-100 justify-content-center align-items-center">
    <div class="row">
        <div class="display-4 p-5 text-center">Регистрация</div>
        <form class="col-12" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <!--            {{ form.non_field_errors }}-->
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Отправить</button>
            <a href="{% url 'catalog:catalog' %}" class="btn btn-outline-danger">Отменить</a>
        </form>
    </div>
</div>
<script src="/static/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll('ul > li').forEach(
        li => {
            li.classList.add('fw-lighter')
            li.style.fontSize='12px'
        }
    )
    document.querySelectorAll('.errorlist > li').forEach(li => {li.classList.remove('fw-lighter')})
    document.querySelectorAll('.errorlist > li').forEach(li => {li.style.color='red'})
</script>
{% endblock %}
